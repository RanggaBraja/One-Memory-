<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terima Kasih - One Memory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="checkout-body">
    <div class="checkout-app-container" style="background-color: #FCF7F3;">
        <!-- App Header (Back to home instead of previous step) -->
        <header class="checkout-header">
            <a href="index.html" class="checkout-back"><i class="ph ph-arrow-left"></i></a>
            <div class="checkout-logo">One Memory</div>
            <div class="checkout-avatar">S</div>
        </header>

        <main class="checkout-content center-content fade-in">
            <!-- Illustration Placeholder (Using external graphic similar to the mockup) -->
            <img src="https://cdn-icons-png.flaticon.com/512/3233/3233483.png" alt="Berhasil" class="success-img fade-in" style="width: 150px; opacity: 0.9; margin-top: 20px;" loading="lazy">
            
            <h1 class="success-title">Terima Kasih!</h1>
            <p class="success-desc">Pesananmu sudah kami Terima dengan baik</p>
            
            <div class="success-est">Estimasi Pengerjaan 3-5 hari</div>
            
            <div class="order-number-box fade-in" style="transition-delay: 0.2s;">
                No. Pesanan
                <strong>#001</strong>
            </div>
            
            <p class="wa-instruction">Kirim bukti transfer di whatsApp kami</p>
            <div class="wa-number">089531656680</div>

            <!-- Single Action Button (Not sticky here, just standard block) -->
            <button class="btn-brown-large" style="width: 100%;" onclick="window.location.href='index.html'">
                Kembali Ke Beranda
            </button>
            <p style="margin-top: 20px; font-size: 0.8rem; color: #7B4B36;">
                <a href="https://wa.me/628123456789?text=Halo%20One%20Memory,%20ini%20bukti%20transfer%20saya%20untuk%20pesanan%20%23001" style="color: inherit; text-decoration: underline;" target="_blank">Klik di sini untuk langsung ke WhatsApp</a>
            </p>
        </main>
    </div>
    
    <script src="js/checkout.js"></script>
</body>
</html>
